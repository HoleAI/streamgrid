<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Grid</title>
    <link rel="stylesheet" href="index.css?v=16">
    <meta name="description" content="Piattaforma di streaming per canali TV sportivi e d'intrattenimento.">
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0c">
    
    <!-- iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Stream Grid">
    <link rel="apple-touch-icon" href="stream-in-colorado.jpg">
</head>
<body>
    <div id="app">
        <header class="navbar glass">
            <div class="logo">Stream Grid</div>
            <button id="install-btn" class="install-btn glass" style="display: none;">📱 Installa App</button>
        </header>

        <main class="max-w-7xl mx-auto">
            <section id="normal-section">
                <h2 class="section-title">Canali Standard</h2>
                <div id="normal-grid" class="channel-grid"></div>
            </section>

            <section id="fast-section" style="display: none;">
                <h2 class="section-title">Canali Fast</h2>
                <div id="fast-grid" class="channel-grid"></div>
            </section>

            <section id="digitale-section">
                <h2 class="section-title">Digitale 🌍</h2>
                <div id="digitale-grid" class="channel-grid"></div>
            </section>
            
            <div style="text-align: center; margin-top: 3rem; padding-bottom: 2rem;">
                <a href="tutorial.html" style="color: #888; text-decoration: none; font-size: 0.85rem;">📖 Vai al Tutorial</a>
            </div>
        </main>
    </div>

    <script>
        let deferredPrompt;
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('install-btn');
            if(installBtn) {
                installBtn.style.display = 'block';
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const installBtn = document.getElementById('install-btn');
            if(installBtn) {
                installBtn.addEventListener('click', async () => {
                    if (deferredPrompt) {
                        deferredPrompt.prompt();
                        const { outcome } = await deferredPrompt.userChoice;
                        if (outcome === 'accepted') {
                            deferredPrompt = null;
                            installBtn.style.display = 'none';
                        }
                    }
                });
            }
        });

        // Service Worker Registration for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    console.log('SW registered!', reg);
                }).catch(err => {
                    console.log('SW registration failed:', err);
                });
            });
        }

        const fastChannels = [
            {"id": 1, "name": "Canale D 📍", "streams": ["5", "92", "136"]},
            {"id": 2, "name": "Canale C ⚽️", "streams": ["1", "134"]},
            {"id": 3, "name": "Canale UNO ✨", "streams": ["130", "170"]}
        ];

        const normalChannels = [
            {"id": 99, "name": "Canale di lavoro 🧪", "urls": ["https://wideiptv.top/player/SkySportCalcioIT", "/api/player?channel=SkySportCalcioIT"], "badge": "TEST", "isTest": true},
            {"id": 4, "name": "Canale D 📍", "url": "https://wideiptv.top/player/zonaDAZN"},
            {"id": 5, "name": "Canale C ⚽️", "url": "https://wideiptv.top/player/SkySportCalcioIT"},
            {"id": 6, "name": "Canale Uno ✨", "url": "https://wideiptv.top/player/SkySportUnoIT"},
            {"id": 7, "name": "Canale T 🥎", "url": "https://wideiptv.top/player/SkySportTennisIT"},
            {"id": 8, "name": "Canale 24 📰", "url": "https://wideiptv.top/player/SkySport24IT"},
            {"id": 9, "name": "Canale E1 🥇", "url": "https://wideiptv.top/player/euro1it"},
            {"id": 10, "name": "Canale E2 🥈", "url": "https://wideiptv.top/player/euro2it"},
            {"id": 11, "name": "Canale B 🏀", "url": "https://wideiptv.top/player/SkySportNBAIT"},
            {"id": 13, "name": "Canale F1 🏎️", "url": "https://wideiptv.top/player/SkySportF1IT"},
            {"id": 14, "name": "Canale Arena ⚔️", "url": "https://wideiptv.top/player/SkySportArenaIT"}
        ];

        const digitaleChannels = [
            {"id": 1, "name": "Rai 1 HD", "url": "/api/tv?id=1"},
            {"id": 2, "name": "Rai 2 HD", "url": "/api/tv?id=2"},
            {"id": 3, "name": "Rai 3 HD", "url": "/api/tv?id=3"},
            {"id": 4, "name": "Rete 4", "url": "/api/tv?id=4"},
            {"id": 5, "name": "Canale 5", "url": "/api/tv?id=5"},
            {"id": 6, "name": "Italia 1", "url": "/api/tv?id=6"},
            {"id": 7, "name": "LA7", "url": "/api/tv?id=7"},
            {"id": 8, "name": "TV8", "url": "/api/tv?id=8"},
            {"id": 9, "name": "Nove", "url": "/api/tv?id=9"},
            {"id": 20, "name": "20 Mediaset", "url": "/api/tv?id=20"},
            {"id": 52, "name": "DMAX", "url": "/api/tv?id=52"},
            {"id": 58, "name": "Rai Sport", "url": "/api/tv?id=58"},
            {"id": 60, "name": "Sportitalia", "url": "/api/tv?id=60"},
            {"id": 64, "name": "SuperTennis", "url": "/api/tv?id=64"},
            {"id": 100, "name": "RSI LA 2", "url": "/api/tv?id=100"},
            {"id": 101, "name": "RSI LA 1", "url": "/api/tv?id=101"}
        ];

        function renderChannels() {
            const fastGrid = document.getElementById('fast-grid');
            const normalGrid = document.getElementById('normal-grid');
            const digitaleGrid = document.getElementById('digitale-grid');

            fastGrid.innerHTML = fastChannels.map(ch => `
                <div class="channel-card fade-in" onclick="window.location.href='player.html?v=1&type=fast&id=${ch.id}'">
                    <div class="channel-name">${ch.name}</div>
                </div>
            `).join('');

            normalGrid.innerHTML = normalChannels.map(ch => `
                <div class="channel-card fade-in ${ch.isTest ? 'test-card' : ''}" onclick="window.location.href='player.html?v=6&type=normal&id=${ch.id}'">
                    <div class="channel-name">${ch.name}${ch.badge ? `<span class="badge-test">${ch.badge}</span>` : ''}</div>
                </div>
            `).join('');

            digitaleGrid.innerHTML = digitaleChannels.map(ch => `
                <div class="channel-card fade-in" onclick="window.location.href='player.html?v=5&type=digitale&id=${ch.id}'">
                    <div class="channel-name">${ch.name}</div>
                </div>
            `).join('');
        }

        // Initialize
        renderChannels();

        window.addEventListener('scroll', () => {
            const nav = document.querySelector('.navbar');
            if (window.scrollY > 20) {
                nav.style.padding = '0.75rem 2rem';
                nav.style.background = 'rgba(10, 10, 12, 0.9)';
            } else {
                nav.style.padding = '1rem 2rem';
                nav.style.background = 'var(--bg-glass)';
            }
        });
    </script>
</body>
</html>
